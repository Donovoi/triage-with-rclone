name: HDFS dependency remediation discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hdfs-remediation-discovery.yml
      - scripts/provider-lab/hdfs-discovery/**
      - scripts/provider-lab/hdfs-bootstrap/verify_bootstrap.py
      - scripts/tests/test_hdfs_dependency_discovery.py

permissions:
  contents: read

concurrency:
  group: hdfs-remediation-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve and replay the proposed dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check contracts without downloads or native tools
        run: python -B -m unittest discover -s scripts/provider-lab/hdfs-discovery -p 'test_*.py'
      # This runs networked build tools, not Hadoop or a KDC. The container has
      # no host mounts, credentials or published ports. The first stage's network
      # destinations are not confined by Maven settings. The second stage uses
      # a fresh image/container, the isolated pinned seed, --network none and
      # Maven offline mode. The old graph and locks are unchanged. Remaining
      # advisories are unresolved; no security or provider pass is awarded.
      - name: Compare the proposed graph with a fresh offline replay
        run: >-
          python -B scripts/provider-lab/hdfs-discovery/hosted_kerberos_discovery.py
          --candidate scripts/provider-lab/hdfs-discovery/candidate-kerberos-remediation
          --verifier scripts/provider-lab/hdfs-bootstrap/verify_bootstrap.py
          --mode repeat
          --profile kerberos-remediation
          --report "${{ runner.temp }}/hdfs-remediation-discovery.json"
      # Only sanitized facts are retained. Raw archives, POMs and logs stay
      # private to this disposable runner. No provider coverage is awarded.
      - name: Keep the sanitized result for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hdfs-remediation-discovery
          path: ${{ runner.temp }}/hdfs-remediation-discovery.json
          if-no-files-found: warn
          retention-days: 14
