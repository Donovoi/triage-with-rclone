name: Isolated Kerberos ticket experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hdfs-kerberos-ticket.yml
      - scripts/provider-lab/hdfs-kerberos-ticket/**
      - scripts/provider-lab/hdfs-discovery/**
      - scripts/provider-lab/hdfs-bootstrap/**
      - scripts/tests/test_hdfs_kerberos_ticket.py

permissions:
  contents: read

concurrency:
  group: hdfs-kerberos-ticket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ticket:
    name: Check a synthetic ticket in a network-none container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test the supervisor without native tools
        run: python -B -m unittest discover -s scripts/provider-lab/hdfs-kerberos-ticket -p 'test_*.py'
      # Preparation downloads only public, fixed dependencies and the base image.
      # Compilation and the ticket test have no network access. The test uses
      # fresh synthetic credentials, which stay inside the temporary container.
      # This is preparation for HDFS tests; it gives no provider coverage credit.
      - name: Check the ticket, failed requests and cleanup
        run: >-
          python -B scripts/provider-lab/hdfs-kerberos-ticket/ticket_probe_container.py
          --report "${{ runner.temp }}/kerberos-ticket-experiment.json"
      - name: Retain only the sanitized result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kerberos-ticket-experiment
          path: ${{ runner.temp }}/kerberos-ticket-experiment.json
          if-no-files-found: warn
          retention-days: 14
