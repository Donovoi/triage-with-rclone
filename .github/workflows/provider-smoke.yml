name: Provider Smoke
on:
  workflow_dispatch:
    inputs:
      backends:
        description: Optional comma-separated backend or Test remote filter
        required: false
        default: ''
        type: string
      require_all:
        description: Fail unless every discovered provider has a selected test account
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '35 7 * * *'
permissions:
  contents: read
concurrency:
  group: provider-smoke
  cancel-in-progress: false
jobs:
  provider-smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rclone-triage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rclone-triage -> target
      - name: Prepare pinned runtimes
        shell: bash
        run: |
          bash ../scripts/download-rclone.sh
          bash ../scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-smoke"
      - name: Provider evidence regressions
        run: python -B -m unittest discover -s ../scripts/tests -p 'test_*.py'
      - name: Isolated backend protocol fixtures
        run: python -B ../scripts/provider-lab/run_lab.py --rclone "$RUNNER_TEMP/rclone-smoke" --report "$RUNNER_TEMP/provider-fixtures.json"
      - name: Require current provider plans and protocol evidence
        if: ${{ !cancelled() }}
        run: |
          python -B ../scripts/provider_coverage.py --rclone "$RUNNER_TEMP/rclone-smoke" \
            --report "$RUNNER_TEMP/provider-evidence.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-fixtures.json" \
            --require-plans --require-fixtures local,archive,http,webdav,ftp,sftp,s3
      - name: Offline provider contracts
        run: cargo test --locked --release --test provider_smoke --test provider_matrix -- --test-threads=1
      - name: Login and credential regressions without accounts
        run: 'cargo test --locked --release --lib providers:: -- --test-threads=1'
      - name: Validate every provider against the pinned runtime
        env:
          RCLONE_PROVIDER_SCHEMA_BINARY: ${{ runner.temp }}/rclone-smoke
        run: cargo test --locked --release --test provider_matrix pinned_rclone_catalog_matches_provider_contracts -- --ignored --exact --test-threads=1
      - name: Prepare explicit smoke config
        id: config
        env:
          SMOKE_CONFIG: ${{ secrets.RCLONE_PROVIDER_SMOKE_CONFIG }}
        run: |
          if [[ -z "$SMOKE_CONFIG" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Live access NOT RUN: no smoke credentials configured. The coverage artifact will identify every unconfigured provider.' >> "$GITHUB_STEP_SUMMARY"
          else
            umask 077
            printf '%s\n' "$SMOKE_CONFIG" > "$RUNNER_TEMP/triage-smoke.conf"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Inventory missing live coverage without reading credentials
        if: steps.config.outputs.configured == 'false'
        env:
          RCLONE_PROVIDER_SMOKE_RCLONE: ${{ runner.temp }}/rclone-smoke
          RCLONE_PROVIDER_SMOKE_REPORT: ${{ runner.temp }}/provider-coverage.json
          RCLONE_PROVIDER_SMOKE_REPORT_ONLY: 'true'
        run: cargo test --locked --release --test provider_smoke test_configured_provider_remotes_smoke -- --ignored --exact --nocapture --test-threads=1
      - name: Configured provider read access
        if: steps.config.outputs.configured == 'true'
        env:
          RCLONE_PROVIDER_SMOKE_CONFIG: ${{ runner.temp }}/triage-smoke.conf
          RCLONE_PROVIDER_SMOKE_RCLONE: ${{ runner.temp }}/rclone-smoke
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BACKENDS: ${{ inputs.backends }}
          MANUAL_REQUIRE_ALL: ${{ inputs.require_all }}
          RCLONE_PROVIDER_SMOKE_BACKENDS: ${{ vars.RCLONE_PROVIDER_SMOKE_BACKENDS }}
          RCLONE_PROVIDER_SMOKE_REQUIRE_ALL: ${{ vars.RCLONE_PROVIDER_SMOKE_REQUIRE_ALL }}
          RCLONE_PROVIDER_SMOKE_REPORT: ${{ runner.temp }}/provider-coverage.json
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            export RCLONE_PROVIDER_SMOKE_BACKENDS="$MANUAL_BACKENDS"
            export RCLONE_PROVIDER_SMOKE_REQUIRE_ALL="$MANUAL_REQUIRE_ALL"
          fi
          cargo test --locked --release --test provider_smoke test_configured_provider_remotes_smoke -- --ignored --exact --nocapture --test-threads=1
      - name: Require credentials when full live coverage was requested
        if: steps.config.outputs.configured == 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REQUIRE_ALL: ${{ inputs.require_all }}
          REQUIRE_ALL: ${{ vars.RCLONE_PROVIDER_SMOKE_REQUIRE_ALL }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            REQUIRE_ALL="$MANUAL_REQUIRE_ALL"
          fi
          case "$REQUIRE_ALL" in
            true|1) echo 'Full live coverage requested but no account configuration exists.' >&2; exit 1 ;;
            false|0|'') ;;
            *) echo 'Invalid full-coverage option.' >&2; exit 1 ;;
          esac
      - name: Summarize sanitized provider coverage
        if: always()
        env:
          COVERAGE_PATH: ${{ runner.temp }}/provider-coverage.json
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path(os.environ['COVERAGE_PATH'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\nFresh login and refresh grants are not established by saved-credential access tests.\n\n')
              if not path.exists():
                  out.write('Coverage report unavailable: a prerequisite did not complete.\n')
              else:
                  report = json.loads(path.read_text())
                  out.write('| Backend | Live read access | Accounts checked |\n|---|---|---:|\n')
                  for row in report['providers']:
                      assert re.fullmatch(r'[a-z0-9_]+', row['backend'])
                      assert row['status'] in ('not_configured', 'not_requested', 'not_run', 'passed', 'failed')
                      assert isinstance(row['checked_remotes'], int) and row['checked_remotes'] >= 0
                      out.write(f"| {row['backend']} | {row['status']} | {row['checked_remotes']} |\n")
          PY
      - name: Retain sanitized coverage only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-coverage
          path: |
            ${{ runner.temp }}/provider-coverage.json
            ${{ runner.temp }}/provider-fixtures.json
            ${{ runner.temp }}/provider-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/triage-smoke.conf"
