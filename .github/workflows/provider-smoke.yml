name: Provider Smoke
on:
  workflow_dispatch:
    inputs:
      backends:
        description: Optional comma-separated backend or Test remote filter
        required: false
        default: ''
  schedule:
    - cron: '35 7 * * *'
permissions:
  contents: read
jobs:
  provider-smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rclone-triage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rclone-triage -> target
      - name: Prepare pinned runtimes
        shell: bash
        run: |
          bash ../scripts/download-rclone.sh
          bash ../scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-smoke"
      - name: Offline provider contracts
        run: cargo test --locked --release --test provider_smoke --test provider_matrix -- --test-threads=1
      - name: Prepare explicit smoke config
        id: config
        env:
          SMOKE_CONFIG: ${{ secrets.RCLONE_PROVIDER_SMOKE_CONFIG }}
        run: |
          if [[ -z "$SMOKE_CONFIG" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Live provider acceptance NOT RUN: no smoke credentials configured. Offline contracts only.' >> "$GITHUB_STEP_SUMMARY"
          else
            umask 077
            printf '%s\n' "$SMOKE_CONFIG" > "$RUNNER_TEMP/triage-smoke.conf"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Live provider acceptance
        if: steps.config.outputs.configured == 'true'
        env:
          RCLONE_PROVIDER_SMOKE_CONFIG: ${{ runner.temp }}/triage-smoke.conf
          RCLONE_PROVIDER_SMOKE_RCLONE: ${{ runner.temp }}/rclone-smoke
          RCLONE_PROVIDER_SMOKE_BACKENDS: ${{ inputs.backends || vars.RCLONE_PROVIDER_SMOKE_BACKENDS }}
        run: cargo test --locked --release --test provider_smoke test_configured_provider_remotes_smoke -- --ignored --exact --nocapture --test-threads=1
      - name: Remove temporary credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/triage-smoke.conf"
