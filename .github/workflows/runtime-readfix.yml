name: Experimental rclone regressions and native provider reads
on:
  pull_request:
    paths:
      - 'scripts/runtime-readfix/**'
      - 'scripts/runtime-distribution/**'
      - 'scripts/provider-lab/**'
      - '.github/workflows/runtime-readfix.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/runtime-readfix/**'
      - 'scripts/runtime-distribution/**'
      - 'scripts/provider-lab/**'
      - '.github/workflows/runtime-readfix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readfix-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  read-status:
    name: Reproduce read defects and verify experimental builds
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Set runner-local work paths
        shell: bash
        run: |
          printf 'READFIX_ROOT=%s\n' "$RUNNER_TEMP/experimental-readfix" >> "$GITHUB_ENV"
          printf 'READFIX_GO=%s\n' "$RUNNER_TEMP/experimental-go/go/bin/go" >> "$GITHUB_ENV"
          printf 'GOPATH=%s\n' "$RUNNER_TEMP/readfix-gopath" >> "$GITHUB_ENV"
          printf 'GOCACHE=%s\n' "$RUNNER_TEMP/readfix-go-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check regression proof and binary architecture gates
        run: python3 -B -m unittest discover -s scripts/runtime-readfix -p 'test_*.py'
      - name: Check archive reproducibility and distribution evidence gates
        run: python3 -B -m unittest discover -s scripts/runtime-distribution -p 'test_*.py'
      - name: Check native fixture wire boundaries and evidence gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/readfix-fixture-venv"
          "$RUNNER_TEMP/readfix-fixture-venv/bin/python" -m pip --isolated --disable-pip-version-check install --no-cache-dir --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --retries 0 --timeout 20 -r scripts/provider-lab/requirements-fixture.txt
          "$RUNNER_TEMP/readfix-fixture-venv/bin/python" -B -m unittest discover -s scripts/provider-lab/readfix-experimental -p 'test_*.py'
      - name: Acquire the hash-pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("scripts/runtime-readfix/build-lock.json"))["toolchain"])')
          expected=$(python3 -c 'import json; print(json.load(open("scripts/runtime-readfix/build-lock.json"))["linux_amd64_toolchain_sha256"])')
          test ! -e "$RUNNER_TEMP/experimental-go"
          mkdir "$RUNNER_TEMP/experimental-go"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 180 \
            "https://go.dev/dl/$version.linux-amd64.tar.gz" -o "$RUNNER_TEMP/experimental-go.tar.gz"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/experimental-go.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/experimental-go.tar.gz" -C "$RUNNER_TEMP/experimental-go"
      - name: Acquire pinned source and verify modules
        run: python3 -B scripts/runtime-readfix/build.py prepare --work-root "$READFIX_ROOT" --go "$READFIX_GO"
      - name: Require baseline failures and patched passes with the race detector
        run: python3 -B scripts/runtime-readfix/build.py check --work-root "$READFIX_ROOT" --go "$READFIX_GO"
      - name: Build Linux amd64 twice from different roots
        run: python3 -B scripts/runtime-readfix/build.py build --work-root "$READFIX_ROOT" --go "$READFIX_GO" --platform linux-amd64
      - name: Cross-build Windows x64 twice from different roots
        run: python3 -B scripts/runtime-readfix/build.py build --work-root "$READFIX_ROOT" --go "$READFIX_GO" --platform windows-amd64
      - name: Cross-build Windows x86 twice from different roots
        run: python3 -B scripts/runtime-readfix/build.py build --work-root "$READFIX_ROOT" --go "$READFIX_GO" --platform windows-386
      - name: Cross-build Windows ARM64 twice from different roots
        run: python3 -B scripts/runtime-readfix/build.py build --work-root "$READFIX_ROOT" --go "$READFIX_GO" --platform windows-arm64
      - name: Verify all four native read experiments in isolated containers
        run: python3 -B scripts/provider-lab/readfix-experimental/run.py --work-root "$READFIX_ROOT" --go "$READFIX_GO" --output "$RUNNER_TEMP/native-readfix"
      - name: Package verified runtime archives twice
        run: python3 -B scripts/runtime-distribution/package.py --work-root "$READFIX_ROOT" --native-report "$RUNNER_TEMP/native-readfix/report.json" --output "$RUNNER_TEMP/readfix-distribution"
      - name: Retain verified experimental runtime archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-readfix-runtime-distribution
          path: |
            ${{ runner.temp }}/readfix-distribution/*.zip
            ${{ runner.temp }}/readfix-distribution/SHA256SUMS
            ${{ runner.temp }}/readfix-distribution/distribution.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain experimental regression and build receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-read-status-regressions
          path: |
            ${{ runner.temp }}/experimental-readfix/prepared.json
            ${{ runner.temp }}/experimental-readfix/checks.json
            ${{ runner.temp }}/experimental-readfix/artifacts/*/build.json
            ${{ runner.temp }}/experimental-readfix/logs/
            ${{ runner.temp }}/native-readfix/report.json
            ${{ runner.temp }}/native-readfix/*.log
          if-no-files-found: warn
          retention-days: 14
