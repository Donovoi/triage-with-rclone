name: Original Windows runtime cleanup trace
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  original-cleanup:
    name: ARM64 original runtime removal diagnostic
    runs-on: windows-11-arm
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact hosted revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'ARM64') { throw 'Unsupported diagnostic environment' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $env:EXPECTED_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $actual -cne $env:GITHUB_SHA -or $actual -cne $env:EXPECTED_SHA) { throw 'Revision mismatch' }
          Write-Output "tested_commit=$actual"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          targets: aarch64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pure correlation and output checks
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/cleanup-trace/test_pure.py
          if ($LASTEXITCODE -ne 0) { throw 'Output tests failed' }
          cargo fmt --manifest-path tools/cleanup-trace/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Trace formatting failed' }
          cargo clippy --manifest-path tools/cleanup-trace/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Trace lint failed' }
          cargo test --manifest-path tools/cleanup-trace/Cargo.toml --locked --lib model::tests
          if ($LASTEXITCODE -ne 0) { throw 'Pure correlation tests failed' }
      - name: Prepare matching verified runtime
        run: ./scripts/download-rclone.ps1 -Architecture arm64
      - name: Compile the isolated diagnostic test
        working-directory: rclone-triage
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --release --target aarch64-pc-windows-msvc --features runtime-cleanup-trace --test cli_acquisition --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - name: Observe the original cleanup once
        timeout-minutes: 3
        working-directory: rclone-triage
        env:
          TRIAGE_RUNTIME_CLEANUP_TRACE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $application = Join-Path $PWD 'target/aarch64-pc-windows-msvc/release/rclone-triage.exe'
          $runtime = Join-Path $PWD 'assets/rclone.exe'
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          $runtimeHash = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          $pins = @(Get-Content -LiteralPath ../rclone-version.env | Where-Object { $_ -cmatch '\ARCLONE_WINDOWS_ARM64_EXE_SHA256=[0-9a-f]{64}\z' })
          if ($pins.Count -ne 1 -or $pins[0].Substring(32) -cne $runtimeHash) { throw 'Runtime binding failed' }
          $privateOut = Join-Path $env:RUNNER_TEMP 'original-cleanup-stdout.private'
          $privateErr = Join-Path $env:RUNNER_TEMP 'original-cleanup-stderr.private'
          if ([IO.File]::Exists($privateOut) -or [IO.File]::Exists($privateErr)) { throw 'Private log already exists' }
          cargo test --offline --locked --release --target aarch64-pc-windows-msvc --features runtime-cleanup-trace --test cli_acquisition cli_imported_listing_is_complete_recursive_and_preserves_exact_provenance -- --exact --nocapture --test-threads=1 > $privateOut 2> $privateErr
          $originalExit = $LASTEXITCODE
          if ((Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant() -cne $applicationHash -or (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -cne $runtimeHash) { throw 'Tested bytes changed' }
          python -B ../tools/cleanup-trace/validate_result.py --log $privateErr --test-exit $originalExit --runtime-sha256 $runtimeHash --application-sha256 $applicationHash --commit $env:GITHUB_SHA
          $validationExit = $LASTEXITCODE
          if ($originalExit -ne 0) { exit $originalExit }
          exit $validationExit
      # No raw log/ETL/binary artifacts, retries, privileges or provider evidence.
      # Missing output or timeout is unavailable, never a session-stop certificate.
