name: Original Windows runtime cleanup trace
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  original-cleanup:
    name: ARM64 CLI acquisition runtime removal diagnostic
    runs-on: windows-11-arm
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact hosted revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'ARM64') { throw 'Unsupported diagnostic environment' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $env:EXPECTED_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $actual -cne $env:GITHUB_SHA -or $actual -cne $env:EXPECTED_SHA) { throw 'Revision mismatch' }
          Write-Output "tested_commit=$actual"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.95.0
          targets: aarch64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pure correlation and output checks
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/cleanup-trace/test_pure.py
          if ($LASTEXITCODE -ne 0) { throw 'Output tests failed' }
          cargo fmt --manifest-path tools/cleanup-trace/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Trace formatting failed' }
          cargo clippy --manifest-path tools/cleanup-trace/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Trace lint failed' }
          cargo test --manifest-path tools/cleanup-trace/Cargo.toml --locked --lib model::tests
          if ($LASTEXITCODE -ne 0) { throw 'Pure correlation tests failed' }
          cargo test --manifest-path tools/cleanup-trace/Cargo.toml --locked --lib schema_metadata::tests
          if ($LASTEXITCODE -ne 0) { throw 'Pure schema tests failed' }
          $admissionLog = Join-Path $env:RUNNER_TEMP 'original-cleanup-admission-tests.private.log'
          if ([IO.File]::Exists($admissionLog)) { throw 'Pure admission log already exists' }
          cargo test --manifest-path tools/cleanup-trace/Cargo.toml --locked --lib admission::tests -- --test-threads=1 > $admissionLog 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Pure admission tests failed' }
          if ((Get-Item -LiteralPath $admissionLog).Length -gt 262144) { throw 'Pure admission log exceeds bound' }
          $admissionOutput = [IO.File]::ReadAllText($admissionLog)
          $admissionCases = [regex]::Matches($admissionOutput, '(?m)^test admission::tests::[a-z0-9_]+ \.\.\. ok\r?$')
          $admissionSummary = [regex]::Matches($admissionOutput, '(?m)^test result: ok\. 24 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [^\r\n]+\r?$')
          if ($admissionCases.Count -ne 24 -or $admissionSummary.Count -ne 1) { throw 'Pure admission selection mismatch' }
      - name: Prepare matching verified runtime
        run: ./scripts/download-rclone.ps1 -Architecture arm64
      - name: Compile the isolated diagnostic test
        working-directory: rclone-triage
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $cargoJson = Join-Path $env:RUNNER_TEMP 'original-cleanup-build.private.jsonl'
          $cargoErr = Join-Path $env:RUNNER_TEMP 'original-cleanup-build-stderr.private'
          $sourceFile = Join-Path $env:RUNNER_TEMP 'original-cleanup-source.private.json'
          if ([IO.File]::Exists($cargoJson) -or [IO.File]::Exists($cargoErr) -or [IO.File]::Exists($sourceFile)) { throw 'Private build record already exists' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Source changed before build' }
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceTree -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Source tree unavailable' }
          $source = [ordered]@{ commit = $env:GITHUB_SHA; source_tree = $sourceTree; application_source_sha256 = (Get-FileHash -LiteralPath 'src/main.rs' -Algorithm SHA256).Hash.ToLowerInvariant(); test_source_sha256 = (Get-FileHash -LiteralPath 'tests/cli_acquisition.rs' -Algorithm SHA256).Hash.ToLowerInvariant() }
          $source | ConvertTo-Json -Compress | Set-Content -LiteralPath $sourceFile -Encoding utf8
          cargo test --locked --release --target aarch64-pc-windows-msvc --features runtime-cleanup-trace --test cli_acquisition --no-run --message-format=json > $cargoJson 2> $cargoErr
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - name: Observe the original cleanup once
        timeout-minutes: 3
        working-directory: rclone-triage
        env:
          TRIAGE_RUNTIME_CLEANUP_TRACE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $cargoJson = Join-Path $env:RUNNER_TEMP 'original-cleanup-build.private.jsonl'
          $selectedJson = python -B ../tools/cleanup-trace/select_artifacts.py --cargo-json $cargoJson --project $PWD.Path --cli-acquisition
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic artifact selection failed' }
          $selected = $selectedJson | ConvertFrom-Json
          if ($selected.schema -ne 3 -or $selected.artifact_kind -cne 'cli_acquisition') { throw 'Acquisition test binding failed' }
          $application = $selected.application
          $harness = $selected.test_harness
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          $harnessHash = (Get-FileHash -LiteralPath $harness -Algorithm SHA256).Hash.ToLowerInvariant()
          $cargoJsonHash = (Get-FileHash -LiteralPath $cargoJson -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cargoJsonHash -cne $selected.cargo_json_sha256) { throw 'Build record changed' }
          $sourceFile = Join-Path $env:RUNNER_TEMP 'original-cleanup-source.private.json'
          $sourceFileHash = (Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $source = Get-Content -LiteralPath $sourceFile -Raw | ConvertFrom-Json
          if ((@($source.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'application_source_sha256,commit,source_tree,test_source_sha256' -or $source.commit -cne $env:GITHUB_SHA -or $source.source_tree -cnotmatch '\A[0-9a-f]{40}\z' -or $source.application_source_sha256 -cnotmatch '\A[0-9a-f]{64}\z' -or $source.test_source_sha256 -cnotmatch '\A[0-9a-f]{64}\z') { throw 'Source binding failed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Source changed after build' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $source.commit) { throw 'Built revision changed' }
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceTree -cne $source.source_tree -or (Get-FileHash -LiteralPath 'src/main.rs' -Algorithm SHA256).Hash.ToLowerInvariant() -cne $source.application_source_sha256 -or (Get-FileHash -LiteralPath 'tests/cli_acquisition.rs' -Algorithm SHA256).Hash.ToLowerInvariant() -cne $source.test_source_sha256) { throw 'Built source changed' }
          $runtime = Join-Path $PWD 'assets/rclone.exe'
          $runtimeHash = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          $pins = @(Get-Content -LiteralPath ../rclone-version.env | Where-Object { $_ -cmatch '\ARCLONE_WINDOWS_ARM64_EXE_SHA256=[0-9a-f]{64}\z' })
          if ($pins.Count -ne 1 -or $pins[0].Substring(32) -cne $runtimeHash) { throw 'Runtime binding failed' }
          $forwardOut = Join-Path $env:RUNNER_TEMP 'original-cleanup-forwarding-stdout.private'
          $forwardErr = Join-Path $env:RUNNER_TEMP 'original-cleanup-forwarding-stderr.private'
          if ([IO.File]::Exists($forwardOut) -or [IO.File]::Exists($forwardErr)) { throw 'Private forwarding log already exists' }
          & $harness cleanup_diagnostics::tests:: --test-threads=1 > $forwardOut 2> $forwardErr
          $forwardExit = $LASTEXITCODE
          if ($forwardExit -ne 0 -or (Get-Item -LiteralPath $forwardOut).Length -gt 65536) { throw 'Pure forwarding tests failed' }
          $forwardLines = @(Get-Content -LiteralPath $forwardOut)
          $forwardNames = @('exact_caps_and_crlf_are_preserved_without_truncation', 'failure_does_not_duplicate_the_original_assertion_output', 'missing_duplicate_and_oversized_records_are_not_selected', 'success_forwards_only_the_pair', 'writer_failure_is_best_effort')
          $forwardCases = @($forwardLines | Where-Object { $_ -cmatch '\Atest cleanup_diagnostics::tests::[a-z_]+ \.\.\. ok\z' } | Sort-Object)
          $expectedForwardCases = @($forwardNames | ForEach-Object { 'test cleanup_diagnostics::tests::' + $_ + ' ... ok' } | Sort-Object)
          if (($forwardCases -join "`n") -cne ($expectedForwardCases -join "`n") -or @($forwardLines | Where-Object { $_ -ceq 'running 5 tests' }).Count -ne 1 -or @($forwardLines | Where-Object { $_ -cmatch '\Atest result: ok\. 5 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(?:\.[0-9]+)?s\z' }).Count -ne 1) { throw 'Pure forwarding execution binding failed' }
          $privateOut = Join-Path $env:RUNNER_TEMP 'original-cleanup-stdout.private'
          $privateErr = Join-Path $env:RUNNER_TEMP 'original-cleanup-stderr.private'
          $schemaResult = Join-Path $env:RUNNER_TEMP 'original-cleanup-schema.private.json'
          if ([IO.File]::Exists($privateOut) -or [IO.File]::Exists($privateErr) -or [IO.File]::Exists($schemaResult)) { throw 'Private log already exists' }
          & $harness cli_preserves_remote_identity_and_original_config --exact --nocapture --test-threads=1 > $privateOut 2> $privateErr
          $originalExit = $LASTEXITCODE
          Write-Output "test_native_exit=$originalExit"
          if ((Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant() -cne $applicationHash -or (Get-FileHash -LiteralPath $harness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $harnessHash -or (Get-FileHash -LiteralPath $cargoJson -Algorithm SHA256).Hash.ToLowerInvariant() -cne $cargoJsonHash -or (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -cne $runtimeHash -or (Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sourceFileHash -or (Get-FileHash -LiteralPath 'src/main.rs' -Algorithm SHA256).Hash.ToLowerInvariant() -cne $source.application_source_sha256 -or (Get-FileHash -LiteralPath 'tests/cli_acquisition.rs' -Algorithm SHA256).Hash.ToLowerInvariant() -cne $source.test_source_sha256) { throw 'Tested bytes changed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Source changed during test' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $source.commit) { throw 'Tested revision changed' }
          python -B ../tools/cleanup-trace/validate_result.py --log $privateErr --test-exit $originalExit --runtime-sha256 $runtimeHash --application-sha256 $applicationHash --commit $env:GITHUB_SHA --test-stdout $privateOut --test-harness-sha256 $harnessHash --cargo-json-sha256 $cargoJsonHash --cli-acquisition --application-source-sha256 $source.application_source_sha256 --test-source-sha256 $source.test_source_sha256 --source-tree $source.source_tree --schema-result $schemaResult
          $validationExit = $LASTEXITCODE
          if ($originalExit -ne 0) { exit $originalExit }
          exit $validationExit
      # No raw log/ETL/binary artifacts, retries, privileges or provider evidence.
      # Missing output or timeout is unavailable, never a session-stop certificate.
