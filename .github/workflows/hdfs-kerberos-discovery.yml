name: HDFS Kerberos dependency preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hdfs-kerberos-discovery.yml
      - scripts/provider-lab/hdfs-discovery/**
      - scripts/provider-lab/hdfs-bootstrap/verify_bootstrap.py
      - scripts/tests/test_hdfs_dependency_discovery.py

permissions:
  contents: read

concurrency:
  group: hdfs-kerberos-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Check the Kerberos dependencies online and offline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check contracts without downloads or native tools
        run: python -B -m unittest discover -s scripts/provider-lab/hdfs-discovery -p 'test_*.py'
      # This runs networked build tools, not Hadoop or a KDC. The container has
      # no host mounts, credentials or published ports. The first stage's network
      # destinations are not confined by Maven settings. The second stage uses
      # network=none and Maven offline mode. No login or provider pass is awarded.
      - name: Compare the online and isolated offline results
        run: >-
          python -B scripts/provider-lab/hdfs-discovery/hosted_kerberos_discovery.py
          --candidate scripts/provider-lab/hdfs-discovery/candidate-kerberos
          --verifier scripts/provider-lab/hdfs-bootstrap/verify_bootstrap.py
          --mode repeat
          --report "${{ runner.temp }}/hdfs-kerberos-dependency-preparation.json"
      # Only sanitized facts are retained. Raw archives, POMs and logs stay
      # private to this disposable runner. No provider coverage is awarded.
      - name: Keep the sanitized result for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hdfs-kerberos-dependency-preparation
          path: ${{ runner.temp }}/hdfs-kerberos-dependency-preparation.json
          if-no-files-found: warn
          retention-days: 14
