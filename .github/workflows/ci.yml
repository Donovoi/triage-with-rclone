          retention-days: 14
      - name: Require the same-build configured WebDAV evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.webdav_application_acceptance.outcome == 'success' || steps.webdav_application_acceptance.outcome == 'failure') }}
        env:
          PROVIDER_BINARY: ${{ format('{0}/rclone-triage/assets/rclone.exe', github.workspace) }}
          APPLICATION_BINARY: ${{ format('{0}/rclone-triage/target/release/rclone-triage.exe', github.workspace) }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse --verify HEAD)"
          python -B ../scripts/provider_coverage.py --rclone "$PROVIDER_BINARY" \
            --report "$RUNNER_TEMP/provider-evidence-windows-webdav-application.json" \
            --application-receipt "$RUNNER_TEMP/http-application.json" \
            --application-receipt "$RUNNER_TEMP/webdav-application.json" \
            --application "$APPLICATION_BINARY" --application-build-commit "$BUILD_COMMIT" \
            --require-plans --require-application http \
            --require-application-mode webdav:webdav_basic_loopback_cli_v1:windows
      - name: Retain sanitized configured WebDAV application evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-evidence-Windows-webdav-application
          path: |
            ${{ runner.temp }}/webdav-application.json
            ${{ runner.temp }}/provider-evidence-windows-webdav-application.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run isolated Windows TUI experiment
        id: tui_experiment
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'tui_hosted_required' }
          $application = (Resolve-Path target/release/rclone-triage.exe).Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'tui_build_binding_failed' }
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B ../scripts/application-lab/run_windows_tui.py `
            --application $application --application-sha256 $applicationHash `
            --build-commit $buildCommit --report "$env:RUNNER_TEMP/tui-experiment.private.json"
          if ($LASTEXITCODE -ne 0) { throw 'tui_experiment_failed' }
      - name: Validate the same-build TUI experiment evidence
        id: tui_evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.tui_experiment.outcome == 'success' || steps.tui_experiment.outcome == 'failure') }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $application = (Resolve-Path target/release/rclone-triage.exe).Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'tui_build_binding_failed' }
          python -B ../scripts/tui_application_evidence.py `
            --receipt "$env:RUNNER_TEMP/tui-experiment.private.json" --application $application `
            --build-commit $buildCommit --report "$env:RUNNER_TEMP/tui-experiment-validation.json"
          if ($LASTEXITCODE -ne 0) { throw 'tui_experiment_evidence_failed' }
      - name: Retain sanitized TUI experiment evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.tui_evidence.outcome == 'success' || steps.tui_evidence.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-experiment-Windows
          path: ${{ runner.temp }}/tui-experiment-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Record dependency inventory
        if: runner.os == 'Windows'
        shell: bash
        # Publish only the closed inventory schema. Raw Cargo metadata contains
        # contributor contacts and machine paths and must never be uploaded.
        run: |
          if ! cargo metadata --locked --format-version 1 2>/dev/null | \
            python -B ../scripts/sanitize_dependency_inventory.py \
              --metadata - --lockfile "$GITHUB_WORKSPACE/rclone-triage/Cargo.lock" \
              --output - > target/release/dependencies.json; then
            echo 'Dependency inventory generation failed.' >&2
            exit 1
          fi
      - name: Upload checked Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rclone-triage-windows
          path: |
            rclone-triage/target/release/rclone-triage.exe
            rclone-triage/target/release/dependencies.json
            rclone-version.env
          if-no-files-found: error
          retention-days: 14
      - name: Upload checked Windows runtime for isolated application tests
        if: runner.os == 'Windows'
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rclone-runtime-windows
          path: |
            rclone-triage/assets/rclone.exe
            rclone-version.env
          if-no-files-found: error
          retention-days: 14
  windows-ftp:
    name: Windows FTP reconnect experiment
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 2
        with:
          name: rclone-triage-windows
          path: ${{ runner.temp }}/ftp-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 2
        with:
          name: rclone-runtime-windows
          path: ${{ runner.temp }}/ftp-runtime
      - name: Check FTP reconnect and credential replacement with the Windows application
        id: ftp_cases
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'ftp_hosted_required' }
          $application = (Resolve-Path "$env:RUNNER_TEMP/ftp-build/rclone-triage/target/release/rclone-triage.exe").Path
          $runtime = (Resolve-Path "$env:RUNNER_TEMP/ftp-runtime/rclone-triage/assets/rclone.exe").Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -cnotmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'ftp_build_binding_failed' }
          $expectedPins = (Get-FileHash -LiteralPath rclone-version.env -Algorithm SHA256).Hash
          foreach ($manifest in @("$env:RUNNER_TEMP/ftp-build/rclone-version.env", "$env:RUNNER_TEMP/ftp-runtime/rclone-version.env")) {
            if ((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash -cne $expectedPins) { throw 'ftp_runtime_binding_failed' }
          }
          $runtimePin = @(Get-Content -LiteralPath rclone-version.env | Where-Object { $_ -cmatch '^RCLONE_EXE_SHA256=[0-9a-f]{64}$' })
          if ($runtimePin.Count -ne 1 -or (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -cne (($runtimePin[0] -csplit '=', 2)[1])) { throw 'ftp_runtime_binding_failed' }
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B scripts/application-lab/run_windows_ftp.py `
            --application $application --application-sha256 $applicationHash --build-commit $buildCommit `
            --rclone $runtime --report "$env:RUNNER_TEMP/ftp.private.json"
          if ($LASTEXITCODE -ne 0) { throw 'ftp_cases_failed' }
      - name: Independently validate FTP experiment evidence
        id: ftp_validation
        if: ${{ !cancelled() && (steps.ftp_cases.outcome == 'success' || steps.ftp_cases.outcome == 'failure') }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'ftp_hosted_required' }
          $application = (Resolve-Path "$env:RUNNER_TEMP/ftp-build/rclone-triage/target/release/rclone-triage.exe").Path
          $runtime = (Resolve-Path "$env:RUNNER_TEMP/ftp-runtime/rclone-triage/assets/rclone.exe").Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -cnotmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'ftp_build_binding_failed' }
          $expectedPins = (Get-FileHash -LiteralPath rclone-version.env -Algorithm SHA256).Hash
          foreach ($manifest in @("$env:RUNNER_TEMP/ftp-build/rclone-version.env", "$env:RUNNER_TEMP/ftp-runtime/rclone-version.env")) {
            if ((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash -cne $expectedPins) { throw 'ftp_runtime_binding_failed' }
          }
          $runtimePin = @(Get-Content -LiteralPath rclone-version.env | Where-Object { $_ -cmatch '^RCLONE_EXE_SHA256=[0-9a-f]{64}$' })
          if ($runtimePin.Count -ne 1 -or (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -cne (($runtimePin[0] -csplit '=', 2)[1])) { throw 'ftp_runtime_binding_failed' }
          python -B scripts/ftp_application_evidence.py `
            --receipt "$env:RUNNER_TEMP/ftp.private.json" --application $application `
            --build-commit $buildCommit --report "$env:RUNNER_TEMP/ftp-validation.json"
          if ($LASTEXITCODE -ne 0) { throw 'ftp_evidence_failed' }
      - name: Retain only validated FTP experiment evidence
        if: ${{ !cancelled() && (steps.ftp_validation.outcome == 'success' || steps.ftp_validation.outcome == 'failure') }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftp-experiment-Windows
          path: ${{ runner.temp }}/ftp-validation.json
          if-no-files-found: error
          retention-days: 14
