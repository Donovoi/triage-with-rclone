  release:
    name: Publish Windows nightly
    needs: [test, windows-filesystem, windows-ftp, windows-b2, windows-swift, windows-azureblob, windows-swift-cancellation, windows-swift-listing, windows-architectures, audit, python-audit, smb-protocol, linux-provider-evidence, pcloud-oauth-feasibility, pcloud-oauth-authentication, gcs-oauth-lifecycle, windows-webdav-bearer, opendrive-fixed-api, gofile-fixed-api, drime-fixed-api, fichier-fixed-api, premiumizeme-fixed-api, putio-fixed-api, linkbox-fixed-api, yandex-fixed-api, box-fixed-api, onedrive-fixed-api, filelu-fixed-api, qingstor-fixed-api, drive-fixed-api, dropbox-fixed-api, oos-fixed-api, zoho-fixed-api, jottacloud-fixed-api, sugarsync-fixed-api, pikpak-fixed-api, dosya-fixed-api, kdrive-fixed-api, gphotos-fixed-api, huaweidrive-fixed-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - name: Require an exact merged PR into main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GH_REPO/commits/$COMMIT/pulls" --paginate | \
            jq -s --arg sha "$COMMIT" --arg repo "$GH_REPO" \
            '[.[][] | select(.merged_at != null and .base.ref == "main" and .base.repo.full_name == $repo and .merge_commit_sha == $sha)] | length')
          if [[ "$count" -eq 0 ]]; then
            echo 'No merged PR ends at this commit; nightly publication skipped.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          elif [[ "$count" -eq 1 ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Ambiguous merged PR source.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          name: rclone-triage-windows
          path: artifacts/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          name: rclone-triage-windows-x86
          path: artifacts/x86
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          name: rclone-triage-windows-arm64
          path: artifacts/arm64
      - name: Package checked outputs
        if: steps.source.outputs.eligible == 'true'
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -B scripts/package_windows_release.py \
            --artifact-root artifacts --output release --commit "$COMMIT" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --runtime-manifest rclone-version.env
      - name: Attest downloadable package provenance
        if: steps.source.outputs.eligible == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Publish nightly prerelease
        if: steps.source.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cat > nightly-notes.md <<'NOTES'
          Test build for Windows x64, x86 and ARM64. Download and extract the ZIP for your PC.

          Automated checks passed for this commit. Real-account provider testing is still incomplete.
          This nightly is not a full release. Full releases will wait for all-provider acceptance.

          Each ZIP includes the executable, build details, dependency inventory, runtime pins and file checksums.
          SHA256SUMS contains the ZIP checksums; the ZIPs also have GitHub build attestations.
          NOTES
          gh release create "nightly-${RUN_ID}-${RUN_ATTEMPT}" release/* \
            --target "$COMMIT" --title "Nightly ${COMMIT:0:12}" \
            --prerelease --latest=false --notes-file nightly-notes.md
