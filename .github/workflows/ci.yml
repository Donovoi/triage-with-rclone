            --application "$APPLICATION_BINARY" --application-build-commit "$BUILD_COMMIT" \
            --require-plans --require-application http \
            --require-fixtures local,archive,http,webdav,ftp,sftp,s3,swift,b2,azureblob,azurefiles,seafile,memory,koofr,pixeldrain,filefabric,netstorage,internetarchive,sia,hidrive,doi,quatrix,shade,sharefile --require-gcs-static-token
      - name: Retain sanitized Windows application evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-evidence-Windows-application
          path: |
            ${{ runner.temp }}/http-application.json
            ${{ runner.temp }}/provider-evidence-windows-application.json
