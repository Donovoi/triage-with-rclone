name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact commit required by the runtime updater
        required: false
        type: string
      gcs_oauth_experiment:
        description: Run one unqualified GCS OAuth experiment after tests pass
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Each main run needs its own group: even with cancellation disabled,
  # a shared group replaces older pending runs and loses merged-PR nightlies.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  revision:
    name: Validate requested revision
    runs-on: ubuntu-latest
    steps:
      - name: Bind dispatched validation to the requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          GCS_OAUTH_EXPERIMENT: ${{ inputs.gcs_oauth_experiment }}
        run: |
          if [[ "$GCS_OAUTH_EXPERIMENT" == 'true' && -z "$EXPECTED_SHA" ]]; then
            echo 'An exact expected_sha is required for the GCS experiment.' >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" ]] && { [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; }; then
            echo 'The requested commit does not match this workflow run.' >&2
            exit 1
          fi
  audit:
    name: Dependency security audit
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: audit-tool
          workspaces: rclone-triage -> target
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file rclone-triage/Cargo.lock --deny warnings
  python-audit:
    name: Python test dependency security audit
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned auditor in a fresh environment
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_ENV="$RUNNER_TEMP/provider-audit-venv"
          test ! -e "$AUDIT_ENV"
          python -m venv "$AUDIT_ENV"
          "$AUDIT_ENV/bin/python" -m pip --isolated --disable-pip-version-check install \
            --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            --no-input --timeout 30 --retries 2 -r scripts/provider-lab/requirements-audit.txt
      - name: Audit both complete dependency locks
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/provider-audit-venv/bin/python" -m pip_audit \
            --disable-pip --require-hashes --strict --progress-spinner off --timeout 15 \
            -r scripts/provider-lab/requirements-fixture.txt \
            -r scripts/provider-lab/requirements-audit.txt \
            --format json --desc off --output "$RUNNER_TEMP/python-dependency-audit.json"
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dependency-audit
          path: ${{ runner.temp }}/python-dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
  smb-protocol:
    name: Isolated Samba NTLM protocol
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare verified Linux runtime
        shell: bash
        run: bash scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-smb-probe"
      - name: Verify the disposable unprivileged SMB fixture
        shell: bash
        run: |
          python -B scripts/provider-lab/smb/run_container.py \
            --rclone "$RUNNER_TEMP/rclone-smb-probe" \
            --protocol-evidence --report "$RUNNER_TEMP/smb-protocol.json"
      # Schema 3 qualifies only the reviewed Linux/amd64 NTLM read contract.
      # Never upload the image, Docker cache, synthetic credentials or raw logs.
      - name: Retain sanitized SMB protocol result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smb-protocol
          path: ${{ runner.temp }}/smb-protocol.json
          if-no-files-found: warn
          retention-days: 14
  pcloud-oauth-feasibility:
    name: Isolated pCloud OAuth feasibility
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare verified Linux runtime
        shell: bash
        run: bash scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-pcloud-oauth"
      - name: Exercise fresh callback and persisted-token read in a network-none container
        shell: bash
        run: |
          python -B scripts/provider-lab/pcloud-oauth/run_container.py \
            --rclone "$RUNNER_TEMP/rclone-pcloud-oauth" \
            --report "$RUNNER_TEMP/pcloud-oauth-feasibility.json"
      # Positive feasibility only: never import this receipt into the coverage ledger.
      - name: Retain sanitized pCloud feasibility result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pcloud-oauth-feasibility
          path: ${{ runner.temp }}/pcloud-oauth-feasibility.json
          if-no-files-found: warn
          retention-days: 14
  pcloud-oauth-authentication:
    name: Isolated pCloud OAuth authentication
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare verified Linux runtime
        shell: bash
        run: bash scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-pcloud-auth"
      - name: Verify fresh login, exact denials and owned process cancellation
        shell: bash
        run: |
          python -B scripts/provider-lab/pcloud-oauth/run_container.py \
            --rclone "$RUNNER_TEMP/rclone-pcloud-auth" --authentication-evidence \
            --report "$RUNNER_TEMP/pcloud-oauth-authentication.json"
      - name: Retain sanitized pCloud authentication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pcloud-oauth-authentication
          path: ${{ runner.temp }}/pcloud-oauth-authentication.json
          if-no-files-found: warn
          retention-days: 14
  gcs-oauth-experiment:
    name: Isolated GCS OAuth experiment (unqualified)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gcs_oauth_experiment }}
    needs: [revision, test, python-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare verified Linux runtime
        shell: bash
        run: bash scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-gcs-oauth"
      - name: Exercise the GCS lifecycle once in a network-none container
        shell: bash
        run: |
          python -B scripts/provider-lab/gcs-oauth/run_container.py \
            --rclone "$RUNNER_TEMP/rclone-gcs-oauth" \
            --report "$RUNNER_TEMP/gcs-oauth-experiment.json"
      # Source experiment only: no ledger import, images, credentials or raw logs.
      - name: Retain sanitized GCS experiment result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcs-oauth-experiment
          path: ${{ runner.temp }}/gcs-oauth-experiment.json
          if-no-files-found: error
          retention-days: 14
  gcs-oauth-lifecycle:
    name: Isolated GCS OAuth lifecycle
    needs: [revision, test, python-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare verified Linux runtime
        shell: bash
        run: bash scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-gcs-lifecycle"
      - name: Qualify all ten GCS lifecycle cases in a network-none container
        shell: bash
        run: |
          python -B scripts/provider-lab/gcs-oauth/run_container.py \
            --rclone "$RUNNER_TEMP/rclone-gcs-lifecycle" --lifecycle-evidence \
            --report "$RUNNER_TEMP/gcs-oauth-lifecycle.json"
      # Schema 6 contributes only the reviewed Linux OAuth lifecycle mode.
      # Never upload images, credentials, raw logs or private configuration.
      - name: Retain sanitized GCS lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcs-oauth-lifecycle
          path: ${{ runner.temp }}/gcs-oauth-lifecycle.json
          if-no-files-found: error
          retention-days: 14
  test:
    name: Test (${{ matrix.os }})
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        working-directory: rclone-triage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned fixture dependencies in a fresh environment
        shell: bash
        run: |
          set -euo pipefail
          TEST_ENV="$RUNNER_TEMP/provider-test-venv"
          test ! -e "$TEST_ENV"
          python -m venv "$TEST_ENV"
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            TEST_BIN="$TEST_ENV/Scripts"
            TEST_PYTHON="$TEST_BIN/python.exe"
          else
            TEST_BIN="$TEST_ENV/bin"
            TEST_PYTHON="$TEST_BIN/python"
          fi
          "$TEST_PYTHON" -m pip --isolated --disable-pip-version-check install \
            --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            --no-input --timeout 30 --retries 2 -r ../scripts/provider-lab/requirements-fixture.txt
          printf '%s\n' "$TEST_BIN" >> "$GITHUB_PATH"
      - name: Validate Windows acceptance harnesses
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $phase = 'acceptance_source_validation'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          try {
            Get-ChildItem ../scripts/acceptance/windows -Filter *.ps1 | ForEach-Object {
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors) { throw 'acceptance_source_invalid' }
            }
            $phase = 'standalone_conpty_add_type'
            $clock.Restart()
            [pscustomobject]@{ phase=$phase; result='started'; elapsed_ms=0 } | ConvertTo-Json -Compress
            Add-Type -Path ../scripts/acceptance/windows/ConPtyHarness.cs -ErrorAction Stop -WarningAction SilentlyContinue 2>$null
            [pscustomobject]@{ phase=$phase; result='passed'; elapsed_ms=$clock.ElapsedMilliseconds } | ConvertTo-Json -Compress
            & ../scripts/tests/test_hosted_session_pure.ps1
            $phase = 'setup_diagnostic_pure_validation'
            $clock.Restart()
            & ../scripts/tests/test_prepare_case_pure.ps1
            $phase = 'tui_protocol_pure_validation'
            $clock.Restart()
            & ../scripts/tests/test_hosted_tui_session_pure.ps1
            $phase = 'launch_observer_pure_validation'
            $clock.Restart()
            & ../scripts/tests/test_hosted_launch_observer_pure.ps1
          } catch {
            [pscustomobject]@{ phase=$phase; result='failed'; elapsed_ms=$clock.ElapsedMilliseconds } | ConvertTo-Json -Compress
            [Console]::Error.WriteLine('windows_harness_validation_failed')
            exit 1
          }
      - name: Check hosted Windows test folder setup
        if: runner.os == 'Windows'
        run: python -B ../scripts/application-lab/run_windows_http.py --setup-probe
      - name: Check hosted Windows helper readiness and cleanup
        if: runner.os == 'Windows'
        run: python -B ../scripts/application-lab/run_windows_http.py --bridge-probe
      - name: Check hosted Windows source folder ownership and cleanup
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ../scripts/application-lab/probe_source_directory.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check hosted Windows short runtime launch observation
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ../scripts/application-lab/probe_launch_observer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rclone-triage -> target
          cache-on-failure: true
      - name: Prepare verified embedded runtime
        shell: bash
        run: bash ../scripts/download-rclone.sh
      - name: Prepare verified Linux runtime for catalog contracts
        if: runner.os == 'Linux'
        shell: bash
        run: bash ../scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-native"
      - name: Runtime updater and provider evidence regressions
        run: python -B -m unittest discover -s ../scripts/tests -p "test_*.py"
      - name: All 20 isolated backend protocol fixtures
        env:
          PROVIDER_BINARY: ${{ runner.os == 'Windows' && format('{0}/rclone-triage/assets/rclone.exe', github.workspace) || format('{0}/rclone-native', runner.temp) }}
        shell: bash
        run: python -B ../scripts/provider-lab/run_lab.py --rclone "$PROVIDER_BINARY" --report "$RUNNER_TEMP/provider-fixtures.json"
      - name: Isolated FileFabric later-call renewal fixture
        if: ${{ !cancelled() }}
        env:
          PROVIDER_BINARY: ${{ runner.os == 'Windows' && format('{0}/rclone-triage/assets/rclone.exe', github.workspace) || format('{0}/rclone-native', runner.temp) }}
        shell: bash
        run: python -B ../scripts/provider-lab/run_lab.py --rclone "$PROVIDER_BINARY" --filefabric-renewal --report "$RUNNER_TEMP/filefabric-renewal-fixture.json"
      - name: Isolated Internet Archive LOW credential rejection fixture
        if: ${{ !cancelled() }}
        env:
          PROVIDER_BINARY: ${{ runner.os == 'Windows' && format('{0}/rclone-triage/assets/rclone.exe', github.workspace) || format('{0}/rclone-native', runner.temp) }}
        shell: bash
        run: python -B ../scripts/provider-lab/run_lab.py --rclone "$PROVIDER_BINARY" --internetarchive-low-auth --report "$RUNNER_TEMP/internetarchive-low-auth-fixture.json"
      # Internet Archive requires both anonymous reads and separate LOW evidence.
      # Preserve all 19 baseline obligations: 18 complete profiles plus the
      # exact eight-capability GCS static-token mode. GCS lifecycle and pCloud
      # remain unverified here; their separate Linux evidence is combined below.
      - name: Require current provider plans and protocol evidence
        if: ${{ !cancelled() }}
        env:
          PROVIDER_BINARY: ${{ runner.os == 'Windows' && format('{0}/rclone-triage/assets/rclone.exe', github.workspace) || format('{0}/rclone-native', runner.temp) }}
        shell: bash
        run: |
          python -B ../scripts/provider_coverage.py --rclone "$PROVIDER_BINARY" \
            --report "$RUNNER_TEMP/provider-evidence.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-fixtures.json" \
            --fixture-receipt "$RUNNER_TEMP/filefabric-renewal-fixture.json" \
            --fixture-receipt "$RUNNER_TEMP/internetarchive-low-auth-fixture.json" \
            --require-plans --require-fixtures local,archive,http,webdav,ftp,sftp,s3,swift,b2,azureblob,azurefiles,seafile,memory,koofr,pixeldrain,filefabric,netstorage,internetarchive --require-gcs-static-token
      - name: Retain sanitized protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-evidence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/provider-fixtures.json
            ${{ runner.temp }}/filefabric-renewal-fixture.json
            ${{ runner.temp }}/internetarchive-low-auth-fixture.json
            ${{ runner.temp }}/provider-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build release
        run: cargo build --locked --release
      - name: Verify real Windows application against synthetic HTTP data
        id: application_acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $application = (Resolve-Path target/release/rclone-triage.exe).Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$') { throw 'Build revision unavailable.' }
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B ../scripts/application-lab/run_windows_http.py `
            --application $application --application-sha256 $applicationHash `
            --build-commit $buildCommit --report "$env:RUNNER_TEMP/http-application.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows application acceptance failed.' }
      - name: Verify configured WebDAV with the Windows application
        id: webdav_application_acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 22
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $application = (Resolve-Path target/release/rclone-triage.exe).Path
          $runtime = (Resolve-Path assets/rclone.exe).Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$') { throw 'Build revision unavailable.' }
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B ../scripts/application-lab/run_windows_webdav.py `
            --application $application --application-sha256 $applicationHash `
            --build-commit $buildCommit --rclone $runtime --report "$env:RUNNER_TEMP/webdav-application.json"
          if ($LASTEXITCODE -ne 0) { throw 'Configured WebDAV application acceptance failed.' }
      - name: Offline tests and local transfer regressions
        run: cargo test --locked --release -- --test-threads=1
      - name: Every provider against the pinned runtime catalog
        env:
          RCLONE_PROVIDER_SCHEMA_BINARY: ${{ runner.os == 'Windows' && format('{0}/rclone-triage/assets/rclone.exe', github.workspace) || format('{0}/rclone-native', runner.temp) }}
        run: cargo test --locked --release --test provider_matrix pinned_rclone_catalog_matches_provider_contracts -- --ignored --exact --test-threads=1
      - name: Require the same-build HTTP application evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.application_acceptance.outcome == 'success' || steps.application_acceptance.outcome == 'failure') }}
        env:
          PROVIDER_BINARY: ${{ format('{0}/rclone-triage/assets/rclone.exe', github.workspace) }}
          APPLICATION_BINARY: ${{ format('{0}/rclone-triage/target/release/rclone-triage.exe', github.workspace) }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse --verify HEAD)"
          python -B ../scripts/provider_coverage.py --rclone "$PROVIDER_BINARY" \
            --report "$RUNNER_TEMP/provider-evidence-windows-application.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-fixtures.json" \
            --fixture-receipt "$RUNNER_TEMP/filefabric-renewal-fixture.json" \
            --fixture-receipt "$RUNNER_TEMP/internetarchive-low-auth-fixture.json" \
            --application-receipt "$RUNNER_TEMP/http-application.json" \
            --application "$APPLICATION_BINARY" --application-build-commit "$BUILD_COMMIT" \
            --require-plans --require-application http \
            --require-fixtures local,archive,http,webdav,ftp,sftp,s3,swift,b2,azureblob,azurefiles,seafile,memory,koofr,pixeldrain,filefabric,netstorage,internetarchive --require-gcs-static-token
      - name: Retain sanitized Windows application evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-evidence-Windows-application
          path: |
            ${{ runner.temp }}/http-application.json
            ${{ runner.temp }}/provider-evidence-windows-application.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require the same-build configured WebDAV evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.webdav_application_acceptance.outcome == 'success' || steps.webdav_application_acceptance.outcome == 'failure') }}
        env:
          PROVIDER_BINARY: ${{ format('{0}/rclone-triage/assets/rclone.exe', github.workspace) }}
          APPLICATION_BINARY: ${{ format('{0}/rclone-triage/target/release/rclone-triage.exe', github.workspace) }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse --verify HEAD)"
          python -B ../scripts/provider_coverage.py --rclone "$PROVIDER_BINARY" \
            --report "$RUNNER_TEMP/provider-evidence-windows-webdav-application.json" \
            --application-receipt "$RUNNER_TEMP/http-application.json" \
            --application-receipt "$RUNNER_TEMP/webdav-application.json" \
            --application "$APPLICATION_BINARY" --application-build-commit "$BUILD_COMMIT" \
            --require-plans --require-application http \
            --require-application-mode webdav:webdav_basic_loopback_cli_v1:windows
      - name: Retain sanitized configured WebDAV application evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-evidence-Windows-webdav-application
          path: |
            ${{ runner.temp }}/webdav-application.json
            ${{ runner.temp }}/provider-evidence-windows-webdav-application.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run isolated Windows TUI experiment
        id: tui_experiment
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'tui_hosted_required' }
          $application = (Resolve-Path target/release/rclone-triage.exe).Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'tui_build_binding_failed' }
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B ../scripts/application-lab/run_windows_tui.py `
            --application $application --application-sha256 $applicationHash `
            --build-commit $buildCommit --report "$env:RUNNER_TEMP/tui-experiment.private.json"
          if ($LASTEXITCODE -ne 0) { throw 'tui_experiment_failed' }
      - name: Validate the same-build TUI experiment evidence
        id: tui_evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.tui_experiment.outcome == 'success' || steps.tui_experiment.outcome == 'failure') }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $application = (Resolve-Path target/release/rclone-triage.exe).Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'tui_build_binding_failed' }
          python -B ../scripts/tui_application_evidence.py `
            --receipt "$env:RUNNER_TEMP/tui-experiment.private.json" --application $application `
            --build-commit $buildCommit --report "$env:RUNNER_TEMP/tui-experiment-validation.json"
          if ($LASTEXITCODE -ne 0) { throw 'tui_experiment_evidence_failed' }
      - name: Retain sanitized TUI experiment evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.tui_evidence.outcome == 'success' || steps.tui_evidence.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-experiment-Windows
          path: ${{ runner.temp }}/tui-experiment-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Record dependency inventory
        if: runner.os == 'Windows'
        shell: bash
        # Publish only the closed inventory schema. Raw Cargo metadata contains
        # contributor contacts and machine paths and must never be uploaded.
        run: |
          if ! cargo metadata --locked --format-version 1 2>/dev/null | \
            python -B ../scripts/sanitize_dependency_inventory.py \
              --metadata - --lockfile "$GITHUB_WORKSPACE/rclone-triage/Cargo.lock" \
              --output - > target/release/dependencies.json; then
            echo 'Dependency inventory generation failed.' >&2
            exit 1
          fi
      - name: Upload checked Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rclone-triage-windows
          path: |
            rclone-triage/target/release/rclone-triage.exe
            rclone-triage/target/release/dependencies.json
            rclone-version.env
          if-no-files-found: error
          retention-days: 14
  windows-filesystem:
    name: Windows filesystem (${{ matrix.backend }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        backend: [local, archive]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Run the exact checked x64 artifact from this workflow, not a rebuild or
      # a release from a different commit. Keep it separate from source files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rclone-triage-windows
          path: ${{ runner.temp }}/filesystem-build
      - name: Check real Windows application with local files or ZIP
        id: filesystem_cases
        timeout-minutes: 30
        shell: pwsh
        env:
          FILESYSTEM_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'filesystem_hosted_required' }
          $application = (Resolve-Path "$env:RUNNER_TEMP/filesystem-build/rclone-triage/target/release/rclone-triage.exe").Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'filesystem_build_binding_failed' }
          $expectedPins = (Get-FileHash -LiteralPath rclone-version.env -Algorithm SHA256).Hash
          $artifactPins = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/filesystem-build/rclone-version.env" -Algorithm SHA256).Hash
          if ($expectedPins -cne $artifactPins) { throw 'filesystem_runtime_binding_failed' }
          $applicationHash = (Get-FileHash -LiteralPath $application -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B scripts/application-lab/run_windows_filesystem.py `
            --backend $env:FILESYSTEM_BACKEND --application $application --application-sha256 $applicationHash `
            --build-commit $buildCommit --report "$env:RUNNER_TEMP/filesystem.private.json"
          if ($LASTEXITCODE -ne 0) { throw 'filesystem_cases_failed' }
      - name: Independently validate staged filesystem evidence
        id: filesystem_validation
        if: ${{ !cancelled() && (steps.filesystem_cases.outcome == 'success' || steps.filesystem_cases.outcome == 'failure') }}
        timeout-minutes: 3
        shell: pwsh
        env:
          FILESYSTEM_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          $application = (Resolve-Path "$env:RUNNER_TEMP/filesystem-build/rclone-triage/target/release/rclone-triage.exe").Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'filesystem_build_binding_failed' }
          python -B scripts/filesystem_application_evidence.py `
            --backend $env:FILESYSTEM_BACKEND --receipt "$env:RUNNER_TEMP/filesystem.private.json" `
            --application $application --build-commit $buildCommit --report "$env:RUNNER_TEMP/filesystem-validation.json"
          if ($LASTEXITCODE -ne 0) { throw 'filesystem_evidence_failed' }
      - name: Prepare verified runtime for the filesystem coverage ledger
        id: filesystem_runtime
        if: ${{ !cancelled() && steps.filesystem_validation.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: bash scripts/download-rclone.sh
      - name: Require the same-build filesystem mode evidence
        id: filesystem_coverage
        if: ${{ !cancelled() && steps.filesystem_validation.outcome == 'success' && steps.filesystem_runtime.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        env:
          FILESYSTEM_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = switch -CaseSensitive ($env:FILESYSTEM_BACKEND) {
            'local' { 'local:local_filesystem_cli_v1:windows' }
            'archive' { 'archive:archive_zip_local_cli_v1:windows' }
            default { throw 'filesystem_mode_unsupported' }
          }
          $application = (Resolve-Path "$env:RUNNER_TEMP/filesystem-build/rclone-triage/target/release/rclone-triage.exe").Path
          $runtime = (Resolve-Path rclone-triage/assets/rclone.exe).Path
          $buildCommit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $buildCommit) { throw 'filesystem_build_binding_failed' }
          python -B scripts/provider_coverage.py --rclone $runtime `
            --report "$env:RUNNER_TEMP/provider-evidence-windows-filesystem.json" `
            --application-receipt "$env:RUNNER_TEMP/filesystem.private.json" `
            --application $application --application-build-commit $buildCommit `
            --require-plans --require-application-mode $mode
          if ($LASTEXITCODE -ne 0) { throw 'filesystem_coverage_failed' }
      - name: Retain only validated filesystem evidence
        if: ${{ !cancelled() && (steps.filesystem_validation.outcome == 'success' || steps.filesystem_validation.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filesystem-evidence-Windows-${{ matrix.backend }}
          path: ${{ runner.temp }}/filesystem-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain sanitized filesystem coverage ledger
        if: ${{ !cancelled() && (steps.filesystem_coverage.outcome == 'success' || steps.filesystem_coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-evidence-Windows-filesystem-${{ matrix.backend }}
          path: ${{ runner.temp }}/provider-evidence-windows-filesystem.json
          if-no-files-found: error
          retention-days: 14
  windows-architectures:
    name: Windows (${{ matrix.arch }})
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            target: i686-pc-windows-msvc
            os: windows-2022
          - arch: arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: rclone-triage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-${{ matrix.arch }}
          workspaces: rclone-triage -> target
          cache-on-failure: true
      - name: Prepare matching verified runtime
        run: ../scripts/download-rclone.ps1 -Architecture '${{ matrix.arch }}'
      - name: Inspect in-box Windows trace tool metadata
        if: ${{ matrix.arch == 'arm64' }}
        timeout-minutes: 1
        run: |
          ../scripts/tests/test_windows_trace_metadata.ps1
          ../scripts/windows-trace-tool-metadata.ps1
      - name: Offline tests and local transfer regressions on the target
        run: cargo test --locked --release --target '${{ matrix.target }}' -- --test-threads=1
      - name: Target runtime provider catalog
        env:
          RCLONE_PROVIDER_SCHEMA_BINARY: ${{ format('{0}/rclone-triage/assets/rclone.exe', github.workspace) }}
        run: cargo test --locked --release --target '${{ matrix.target }}' --test provider_matrix pinned_rclone_catalog_matches_provider_contracts -- --ignored --exact --test-threads=1
      - name: Build release for the target
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Record dependency inventory
        # Keep raw metadata private; only the closed sanitizer output is uploaded.
        env:
          INVENTORY_LOCKFILE: ${{ format('{0}/rclone-triage/Cargo.lock', github.workspace) }}
          INVENTORY_OUTPUT: ${{ format('{0}/rclone-triage/target/{1}/release/dependencies.json', github.workspace, matrix.target) }}
        run: |
          $metadata = cargo metadata --locked --format-version 1 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Dependency metadata failed' }
          $metadata | python -B ../scripts/sanitize_dependency_inventory.py `
            --metadata - --lockfile "$env:INVENTORY_LOCKFILE" `
            --output "$env:INVENTORY_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inventory failed' }
      - name: Upload checked Windows target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rclone-triage-windows-${{ matrix.arch }}
          path: |
            rclone-triage/target/${{ matrix.target }}/release/rclone-triage.exe
            rclone-triage/target/${{ matrix.target }}/release/dependencies.json
            rclone-version.env
          if-no-files-found: error
          retention-days: 14
  linux-provider-evidence:
    name: Combined Linux provider evidence
    needs: [test, smb-protocol, pcloud-oauth-authentication, gcs-oauth-lifecycle]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Only same-run, named Linux artifacts are accepted. Do not merge Windows
      # receipts or retrieve evidence from an earlier workflow/runtime.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-evidence-Linux
          path: ${{ runner.temp }}/provider-baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smb-protocol
          path: ${{ runner.temp }}/provider-smb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pcloud-oauth-authentication
          path: ${{ runner.temp }}/provider-pcloud
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gcs-oauth-lifecycle
          path: ${{ runner.temp }}/provider-gcs
      - name: Prepare verified Linux runtime
        run: bash scripts/download-rclone.sh --linux "$RUNNER_TEMP/rclone-ledger"
      - name: Require all 21 reviewed Linux protocol profiles
        run: |
          python -B scripts/provider_coverage.py --rclone "$RUNNER_TEMP/rclone-ledger" \
            --report "$RUNNER_TEMP/provider-evidence-linux-combined.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-baseline/provider-fixtures.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-baseline/filefabric-renewal-fixture.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-baseline/internetarchive-low-auth-fixture.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-smb/smb-protocol.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-pcloud/pcloud-oauth-authentication.json" \
            --fixture-receipt "$RUNNER_TEMP/provider-gcs/gcs-oauth-lifecycle.json" \
            --require-plans --require-fixtures local,archive,http,webdav,ftp,sftp,s3,swift,b2,azureblob,azurefiles,seafile,memory,koofr,pixeldrain,filefabric,netstorage,internetarchive,gcs,smb,pcloud
      - name: Retain sanitized combined ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-evidence-Linux-combined
          path: ${{ runner.temp }}/provider-evidence-linux-combined.json
          if-no-files-found: warn
          retention-days: 14
  release:
    name: Publish Windows nightly
    needs: [test, windows-filesystem, windows-architectures, audit, python-audit, smb-protocol, linux-provider-evidence, pcloud-oauth-feasibility, pcloud-oauth-authentication, gcs-oauth-lifecycle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - name: Require an exact merged PR into main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GH_REPO/commits/$COMMIT/pulls" --paginate | \
            jq -s --arg sha "$COMMIT" --arg repo "$GH_REPO" \
            '[.[][] | select(.merged_at != null and .base.ref == "main" and .base.repo.full_name == $repo and .merge_commit_sha == $sha)] | length')
          if [[ "$count" -eq 0 ]]; then
            echo 'No merged PR ends at this commit; nightly publication skipped.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          elif [[ "$count" -eq 1 ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Ambiguous merged PR source.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          name: rclone-triage-windows
          path: artifacts/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          name: rclone-triage-windows-x86
          path: artifacts/x86
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.eligible == 'true'
        with:
          name: rclone-triage-windows-arm64
          path: artifacts/arm64
      - name: Package checked outputs
        if: steps.source.outputs.eligible == 'true'
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -B scripts/package_windows_release.py \
            --artifact-root artifacts --output release --commit "$COMMIT" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --runtime-manifest rclone-version.env
      - name: Attest downloadable package provenance
        if: steps.source.outputs.eligible == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Publish nightly prerelease
        if: steps.source.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cat > nightly-notes.md <<'NOTES'
          Test build for Windows x64, x86 and ARM64. Download and extract the ZIP for your PC.

          Automated checks passed for this commit. Real-account provider testing is still incomplete.
          This nightly is not a full release. Full releases will wait for all-provider acceptance.

          Each ZIP includes the executable, build details, dependency inventory, runtime pins and file checksums.
          SHA256SUMS contains the ZIP checksums; the ZIPs also have GitHub build attestations.
          NOTES
          gh release create "nightly-${RUN_ID}-${RUN_ATTEMPT}" release/* \
            --target "$COMMIT" --title "Nightly ${COMMIT:0:12}" \
            --prerelease --latest=false --notes-file nightly-notes.md
